name: Auto Merge Dev to Main

on:
  push:
    branches:
      - development

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: development

      - name: Create Pull Request to main
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PUSH_TO_MAIN }}
          commit-message: "chore: sync development into main"
          title: "🔄 Auto PR: Merge development → main"
          body: "This pull request was created automatically by a GitHub Action."
          base: main
          branch: dev-to-main-auto
          delete-branch: true

  auto-approve:
    needs: create-pr
    if: ${{ needs.create-pr.outputs.pull-request-number }}
    runs-on: ubuntu-latest

    steps:
      - name: Auto approve PR
        uses: hmarr/auto-approve-action@v3
        with:
          github-token: ${{ secrets.PUSH_TO_MAIN }}

  auto-merge:
    needs: auto-approve
    runs-on: ubuntu-latest

    steps:
      - name: Enable auto-merge
        uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: ${{ secrets.PUSH_TO_MAIN }}
          pull-request-number: ${{ needs.create-pr.outputs.pull-request-number }}
          merge-method: squash
